name: AR Preview — semana na Assembleia da República
# Todos os dias, 7h07 e 18h07 (Lisboa): relê a agenda da AR e atualiza a página (novas, alteradas, retiradas).
#   De segunda a quinta trabalha a semana em curso; de sexta a domingo prepara a semana seguinte.
# Segunda-feira de manhã (9h07 Lisboa, com horas de reserva): envia o email aos dirigentes com a edição já atualizada nessa manhã.
# O GitHub não garante as horas agendadas (atrasa-as ou salta-as quando está carregado: a 2/11/2026 não correram nem a das 7h07
# nem a das 9h07). Por isso há horas de reserva — 7h37 para a atualização, 9h37 e 11h07 para o envio — e o envio só sai uma vez
# por edição: fica registado em docs/.enviado e as corridas agendadas seguintes não voltam a enviar. O envio à mão envia sempre.
# Horas em UTC = hora de Lisboa no inverno. No horário de verão, subtrair 1 às horas.
on:
  schedule:
    - cron: '7 7 * * *'
    - cron: '37 7 * * *'
    - cron: '7 18 * * *'
    - cron: '7 9 * * 1'
    - cron: '37 9 * * 1'
    - cron: '7 11 * * 1'
  workflow_dispatch:
    inputs:
      passo:
        description: 'atualizar | enviar | teste (envia só para a conta remetente, sem dirigentes nem registo)'
        default: 'atualizar'

permissions:
  contents: write

concurrency:
  group: ar-preview
  cancel-in-progress: false

jobs:
  atualizar:
    if: (github.event_name == 'schedule' && !endsWith(github.event.schedule, '* * 1')) || github.event.inputs.passo == 'atualizar'
    runs-on: ubuntu-latest
    env:
      SMTP_OK: ${{ secrets.SMTP_SERVER != '' && 'sim' || 'nao' }}
      AMALIA_MINUTOS: '120'   # tempo máximo do Amália nas fichas por corrida; o que faltar fica para a seguinte
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # o estado mais recente (uma corrida em fila não pode trabalhar sobre dados antigos)
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Recolher a agenda da AR (semana-alvo)
        run: python scripts/recolher_agenda.py
      - name: Triagem por regras
        run: python scripts/triar.py
      - name: Montar ou atualizar a edição
        id: montar
        run: python scripts/montar_edicao.py
      - name: Expressões fixas de pesquisa (reuniões sem assunto na ordem de trabalhos)
        run: python scripts/expressoes_fixas.py
      - name: "Amália — há trabalho para o modelo?"
        id: amalia
        run: |
          python -c "import json,sys; d=json.load(open('dados/agenda.json',encoding='utf-8')); sys.exit(0 if any((x['pertinencia'] in ('Imediato','Vigilância') and not x.get('expressoes')) and not x.get('validado') and not x.get('amalia') and not x.get('retirado') for x in d['destaques']+d['agenda']) else 1)" && T=sim || T=nao
          python scripts/amalia_varrimento.py --verificar >/dev/null && V=sim || V=nao
          echo "triagem=$T" >> $GITHUB_OUTPUT; echo "fichas=$V" >> $GITHUB_OUTPUT
          echo "triagem: $T · fichas: $V"
      # o Amália corre como no Radar de Notícias: pesos abertos do Hugging Face, em cache, no próprio servidor
      - name: Cache do modelo Amália
        if: steps.amalia.outputs.triagem == 'sim' || steps.amalia.outputs.fichas == 'sim'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: amalia-9b-q4km-v1
      - name: Instalar o Amália (llama-cpp já compilado para processador)
        if: steps.amalia.outputs.triagem == 'sim' || steps.amalia.outputs.fichas == 'sim'
        run: |
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install huggingface-hub
      - name: "Amália — assunto e expressões de pesquisa"
        if: steps.amalia.outputs.triagem == 'sim'
        timeout-minutes: 60
        run: python scripts/amalia_triagem.py || echo "triagem do Amália falhou; ficam as regras"
      - name: Cobertura mediática de todas as matérias (sem IA, a partir do Radar de Notícias)
        run: python scripts/cobertura.py
      - name: "Varrimento automático a partir do Radar de Notícias, com a análise do Amália"
        timeout-minutes: 180
        run: |
          if [ "${{ steps.amalia.outputs.fichas }}" = "sim" ]; then
            python scripts/amalia_varrimento.py || { echo "Amália falhou — fichas só com as notícias do Radar"; python scripts/amalia_varrimento.py --sem-ia; }
          else python scripts/amalia_varrimento.py --sem-ia; fi
      - name: Ligações diretas às notícias (resolve os reencaminhamentos do Google Notícias; cache em dados/ligacoes.json)
        timeout-minutes: 25
        run: python scripts/resolver_ligacoes.py || echo "resolução de ligações falhou; ficam as do Google"
      - name: Verificar se a página precisa de ser refeita
        id: muda
        run: |
          H=$(cat dados/agenda.json modelo/template_cartoes.html scripts/gerar.py scripts/email_resumo.py scripts/sintese.py scripts/calendario.py $(ls docs/edicoes/*.json 2>/dev/null | grep -v indice.json) | sha256sum | cut -c1-16)
          if [ -f docs/.fonte ] && [ "$(cat docs/.fonte)" = "$H" ]; then echo "muda=nao" >> $GITHUB_OUTPUT; echo "sem alterações"; else echo "muda=sim" >> $GITHUB_OUTPUT; echo "$H" > .fonte_nova; fi
      - uses: actions/setup-node@v4
        if: steps.muda.outputs.muda == 'sim'
        with: { node-version: '20' }
      - name: Gerar página, PDF e pasta pública
        if: steps.muda.outputs.muda == 'sim'
        run: |
          npm i playwright && npx playwright install --with-deps chromium
          python scripts/gerar.py dados/agenda.json saida/ar-preview.html
          node scripts/pdf.js saida/ar-preview.html saida/ar-preview.pdf
          mkdir -p docs/edicoes
          rm -f docs/ar-ahead.pdf saida/ar-ahead.html saida/ar-ahead.pdf   # ficheiros do nome antigo
          cp saida/ar-preview.html docs/index.html
          cp saida/ar-preview.pdf docs/ar-preview.pdf
          cp dados/agenda.json docs/agenda.json
          PAGINA_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ python scripts/calendario.py dados/agenda.json docs/cal
          N=$(python -c "import json;print(json.load(open('dados/agenda.json',encoding='utf-8'))['edicao']['numero'])")
          cp saida/ar-preview.html "docs/edicoes/n$(printf %02d $N).html"
          cp dados/agenda.json "docs/edicoes/n$(printf %02d $N).json"
          python scripts/indice_edicoes.py
          touch docs/.nojekyll
          mv .fonte_nova docs/.fonte
      - name: Guardar no repositório
        run: |
          git config user.name "ar-preview-bot"; git config user.email "upe@sggoverno.gov.pt"
          git add -A dados/ docs/ saida/
          git commit -m "Atualização automática $(TZ=Europe/Lisbon date '+%Y-%m-%d %Hh%M')" || { echo "sem alterações"; exit 0; }
          git pull --rebase && git push
      - name: Avisar a revisão (EMAIL_TRIAGEM) quando começa uma semana nova (lista para rever)
        if: steps.montar.outputs.nova_semana == 'sim' && env.SMTP_OK == 'sim'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: AR Preview
          to: ${{ secrets.EMAIL_TRIAGEM }}
          subject: "AR Preview — nova semana em preparação: triagem para rever"
          body: "A edição da semana seguinte já está na página e será atualizada duas vezes por dia. Para corrigir uma pertinência ou o assunto, acrescente uma linha a dados/correcoes.csv (chave;uo;pertinencia;assunto, com uo vazio), copiando a chave da lista em anexo. As correções entram na atualização seguinte. Envio aos dirigentes: segunda-feira de manhã."
          attachments: dados/triagem_semana.csv

  enviar:
    if: (github.event_name == 'schedule' && endsWith(github.event.schedule, '* * 1')) || github.event.inputs.passo == 'enviar' || github.event.inputs.passo == 'teste'
    runs-on: ubuntu-latest
    env:
      SMTP_OK: ${{ secrets.SMTP_SERVER != '' && 'sim' || 'nao' }}
      PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # o estado mais recente (uma corrida em fila não pode trabalhar sobre dados antigos)
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Já foi enviado esta edição?
        id: ja
        run: |
          E=$(python -c "import json;e=json.load(open('dados/agenda.json',encoding='utf-8'))['edicao'];print(f\"{e['numero']}|{e['inicio']}\")")
          echo "edicao=$E" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f docs/.enviado ] && [ "$(cat docs/.enviado)" = "$E" ]; then
            echo "enviado=sim" >> $GITHUB_OUTPUT; echo "Edição $E já enviada — esta corrida agendada não volta a enviar."
          else echo "enviado=nao" >> $GITHUB_OUTPUT; fi
      - name: Preparar o corpo e o assunto do email (lista única, com unidade, Governo e síntese)
        if: steps.ja.outputs.enviado == 'nao'
        id: corpo
        run: |
          python scripts/email_resumo.py dados/agenda.json assunto.txt > email.html
          P=""; if [ "${{ github.event.inputs.passo }}" = "teste" ]; then P="[TESTE] "; fi
          echo "assunto=${P}$(cat assunto.txt)" >> $GITHUB_OUTPUT
      - name: Enviar aos dirigentes
        id: envio
        if: env.SMTP_OK == 'sim' && steps.ja.outputs.enviado == 'nao'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: AR Preview      # nome que aparece como remetente; o endereço é o da conta SMTP (SMTP_USER)
          to: ${{ secrets.SMTP_USER }}             # o remetente recebe em «Para»; os dirigentes seguem em cópia oculta
          bcc: ${{ github.event.inputs.passo != 'teste' && secrets.DIRIGENTES_DSSD || '' }}      # Cco (no teste, ninguém além do remetente)
          subject: ${{ steps.corpo.outputs.assunto }}
          html_body: file://email.html   # sem anexo: o PDF está na página (botão Imprimir / PDF)
      - name: Registar o envio (as corridas agendadas seguintes desta edição não voltam a enviar)
        if: steps.envio.outcome == 'success' && github.event.inputs.passo != 'teste'
        run: |
          echo "${{ steps.ja.outputs.edicao }}" > docs/.enviado
          git config user.name "ar-preview-bot"; git config user.email "upe@sggoverno.gov.pt"
          git add docs/.enviado && git commit -m "Email enviado: edição ${{ steps.ja.outputs.edicao }}" || exit 0
          for t in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
      - name: Sem segredos SMTP
        if: env.SMTP_OK != 'sim'
        run: echo "Segredos SMTP por criar — email não enviado. O corpo preparado foi este:" && cat email.html
